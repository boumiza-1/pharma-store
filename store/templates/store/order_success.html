<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Commande confirmée</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .success {
            font-size: 60px;
        }

        h1 {
            color: #198754;
        }

        .order-number {
            font-size: 20px;
            margin: 20px 0;
        }

        .total {
            font-size: 25px;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 25px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="success">
        ✅
    </div>

    <h1>
        Commande confirmée !
    </h1>

    <p>
        Merci pour votre commande.
    </p>

    <div class="order-number">
        Commande #{{ order.id }}
    </div>

    <p>
        Client :
        <strong>{{ order.customer_name }}</strong>
    </p>

    <p>
        Téléphone :
        {{ order.phone }}
    </p>

    <p>
        Ville :
        {{ order.city }}
    </p>

    <div class="total">
        Total : {{ order.total }} DT
    </div>

    <a
        href="{% url 'product_list' %}"
        class="btn"
    >
        Retour aux produits
    </a>

</div>

</body>

</html>
